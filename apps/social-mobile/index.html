<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; img-src 'self' blob: data:; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AliaSpaces local demo</title>
  <link rel="stylesheet" href="./src/ui/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">A</span>
      <div>
        <p class="product">AliaSpaces</p>
        <p class="mode">Local demo · device storage only</p>
      </div>
    </div>
    <p id="actorLabel" class="actor">No local profile yet</p>
  </header>

  <div class="banner" role="status">
    This is a local/demo prototype. Profiles, posts, reactions, reports, and blocks stay on this device. There are no online users and no network.
  </div>

  <main id="main" class="sheet">
    <p><a href="./akasha.html">Akasha: your Akashic records (local/demo)</a></p>
    <section id="panel-feed" class="panel" data-panel="feed"></section>
    <section id="panel-compose" class="panel" data-panel="compose" hidden></section>
    <section id="panel-profiles" class="panel" data-panel="profiles" hidden></section>
    <section id="panel-safety" class="panel" data-panel="safety" hidden></section>
    <section id="panel-you" class="panel" data-panel="you" hidden></section>
  </main>

  <nav class="tabs" aria-label="Primary">
    <button type="button" data-nav="feed" class="tab is-active">Feed</button>
    <button type="button" data-nav="compose" class="tab">Post</button>
    <button type="button" data-nav="profiles" class="tab">Profiles</button>
    <button type="button" data-nav="safety" class="tab">Safety</button>
    <button type="button" data-nav="you" class="tab">You</button>
  </nav>

  <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
  <script src="./src/domain/local-social.js"></script>
  <script src="./src/ui/app.js"></script>
</body>
</html>
