<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="AliaSpaces is temporarily forwarding its owner and persona experience to the current MyPersonas host while the migration continues.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#6d4aff">
  <meta property="og:title" content="AliaSpaces is moving">
  <meta property="og:description" content="Continue to the current MyPersonas host while the AliaSpaces migration is in progress.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aliaspaces.com/">
  <meta property="og:site_name" content="AliaSpaces">
  <meta name="twitter:card" content="summary">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <link rel="canonical" href="https://mypersonas.online/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>AliaSpaces is moving</title>
  <style>
    :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f7f4ff,#f2fbff);color:#162033}
    main{width:min(560px,100%);padding:34px;border:1px solid #dce3ef;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(35,46,76,.12);text-align:center}
    .mark{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:18px;background:#6d4aff;color:#fff;font-size:28px;font-weight:800}
    h1{margin:18px 0 8px;font-size:clamp(28px,7vw,42px);letter-spacing:-.04em}p{margin:0 auto 18px;max-width:43ch;color:#5c6679;line-height:1.55}
    a{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:11px 18px;border-radius:12px;background:#17233d;color:#fff;font-weight:750;text-decoration:none}
    small{display:block;margin-top:18px;color:#778196}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">A</div>
    <h1>AliaSpaces</h1>
    <p>The owner and persona experience is currently hosted at MyPersonas while the AliaSpaces migration continues.</p>
    <a id="continue" href="https://mypersonas.online/">Continue securely</a>
    <small>Taking you there now…</small>
  </main>
  <script>
    (() => {
      const destination = new URL(location.pathname + location.search + location.hash, "https://mypersonas.online");
      document.getElementById("continue").href = destination.href;
      setTimeout(() => location.replace(destination.href), 120);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=https://mypersonas.online/"></noscript>
</body>
</html>
