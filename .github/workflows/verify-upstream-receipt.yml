name: Qualify read-only MyPersonas receipt access
on:
  push:
    branches: [codex/alia-domain-reconciliation-20261102]
    paths: [.github/workflows/verify-upstream-receipt.yml]
  workflow_dispatch:
    inputs:
      backend_run_id:
        description: "Exact successful MyPersonas backend run (read-only probe)"
        default: "41519827174"
        type: string
permissions:
  contents: read
  actions: read
jobs:
  receipt-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - id: pin
        name: Read exact source pin
        run: |
          pin="$(node -e 'import("./scripts/build-social-site.mjs").then(async m => console.log((await m.readPin()).commit))')"
          printf '%s' "${pin}" | grep -Eq '^[0-9a-f]{40}$'
          echo "commit=${pin}" >> "${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: Justice-Write/MyPersonas
          name: image-caption-backend-${{ steps.pin.outputs.commit }}
          path: .release-evidence
          run-id: ${{ inputs.backend_run_id || '41519827174' }}
          github-token: ${{ github.token }}
      - name: Validate receipt without claiming canary or deployment
        env:
          PIN: ${{ steps.pin.outputs.commit }}
        run: node scripts/verify-backend-receipt.mjs --pin "${PIN}" --receipt .release-evidence/image-caption-backend.txt
