name: Deploy AliaSpaces migration front door

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate front door and release boundary
        run: node --test tests/front-door.test.mjs
      - name: Prepare public artifact
        run: |
          mkdir -p .pages-artifact
          rsync -a --delete \
            --include '/index.html' \
            --include '/404.html' \
            --include '/favicon.svg' \
            --include '/CNAME' \
            --include '/.nojekyll' \
            --exclude '*' \
            ./ .pages-artifact/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .pages-artifact
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
